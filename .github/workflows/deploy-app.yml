name: Deploy app to Azure

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "api/**"
      - "app-host.js"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-app-${{ vars.APP_NAME }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: /api

      - run: npm test

      - name: Prepare deployment package
        run: |
          npm prune --omit=dev
          mkdir deploy
          cp package.json package-lock.json app-host.js deploy/
          mkdir -p deploy/api
          cp api/app.js deploy/api/
          cp -R node_modules deploy/node_modules
          cp -R .output deploy/.output

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.APP_NAME }}
          publish-profile: ${{ secrets.APP_PUBLISH_PROFILE }}
          package: deploy
